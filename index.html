<title>Nettby Nostalgi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 2006-era portal: header band, tab row, three columns (sidebar / innhold / sidebar) that stack on phones */
:root {
  --page: #dfe9f3;        /* himmelblå bakgrunn */
  --panel: #ffffff;
  --panel-alt: #f2f7fc;
  --line: #9db7d1;
  --navy: #1d3f6e;        /* toppbanner, overskrifter */
  --navy-2: #2f5d95;
  --orange: #f08a1c;      /* knapper, uleste ting */
  --orange-dark: #c96b06;
  --ink: #1b2430;
  --muted: #5d6f84;
  --link: #1650a8;
  --ok: #2f8a3a;
  --font-ui: Verdana, Tahoma, "DejaVu Sans", Geneva, sans-serif;
  --font-head: "Trebuchet MS", "Lucida Grande", Tahoma, sans-serif;
  --fs: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink);
  font: var(--fs)/1.45 var(--font-ui);
}
a, .lnk { color: var(--link); text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
a:hover, .lnk:hover { text-decoration: underline; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; }

.shell { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }

/* toppbanner */
.top { background: linear-gradient(#2f5d95, #1d3f6e); border: 1px solid var(--navy); border-bottom: 0; color: #fff; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 14px; }
.logo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.logo h1 { font-size: 30px; letter-spacing: -1px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #0d2442; }
.logo h1 span { color: #ffb350; }
.logo small { color: #c7d9ee; font-size: 11px; }
.who { font-size: 11px; color: #dbe7f5; text-align: right; }
.who b { color: #fff; }
.who .lnk { color: #ffd08f; }

.tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--navy); border: 1px solid var(--navy); padding: 4px 4px 0; }
.tabs button { font: bold 11px var(--font-ui); background: #c9daec; color: var(--navy); border: 1px solid #9db7d1; border-bottom: 0; padding: 5px 10px; cursor: pointer; }
.tabs button:hover { background: #fff; }
.tabs button.on { background: var(--panel); color: var(--ink); }
.tabs .cnt { background: var(--orange); color: #fff; padding: 0 4px; margin-left: 3px; font-size: 10px; }

.cols { display: grid; grid-template-columns: 190px minmax(0, 1fr) 190px; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-top: 0; padding: 10px; }
.cols > * { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 820px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  #left { order: 2; } #main { order: 1; } #right { order: 3; }
}

.box { border: 1px solid var(--line); background: var(--panel); }
.box > .bh { background: linear-gradient(#e9f1fa, #cfdff0); border-bottom: 1px solid var(--line); color: var(--navy); font: bold 11px var(--font-ui); text-transform: uppercase; letter-spacing: .5px; padding: 4px 7px; display: flex; justify-content: space-between; gap: 6px; }
.box > .bb { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.box.alt > .bb { background: var(--panel-alt); }

.btn { font: bold 11px var(--font-ui); background: linear-gradient(#ffa846, var(--orange)); color: #fff; border: 1px solid var(--orange-dark); padding: 4px 10px; cursor: pointer; }
.btn:hover { background: var(--orange-dark); }
.btn.grey { background: linear-gradient(#fff, #dce6f0); color: var(--navy); border-color: var(--line); }
.btn.grey:hover { background: #eef4fa; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

input[type=text], input[type=password], input[type=number], textarea, select { font: 12px var(--font-ui); border: 1px solid #8fa8c2; padding: 3px 4px; background: #fff; color: var(--ink); width: 100%; }
textarea { min-height: 70px; resize: vertical; }
label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.form { display: flex; flex-direction: column; gap: 6px; }
.err { color: #b3261e; font-size: 11px; }

.muted { color: var(--muted); font-size: 11px; }
.small { font-size: 11px; }

.av { width: 40px; height: 40px; flex: none; display: grid; place-items: center; color: #fff; font: bold 15px var(--font-head); border: 1px solid #555; text-shadow: 1px 1px 0 rgba(0,0,0,.4); }
.av.big { width: 100px; height: 100px; font-size: 36px; border-width: 2px; }
.av.tiny { width: 22px; height: 22px; font-size: 10px; }

.ulist { display: flex; flex-direction: column; gap: 4px; }
.uline { display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }

.gb { display: flex; flex-direction: column; gap: 8px; }
.gbe { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; border-bottom: 1px dotted var(--line); padding-bottom: 8px; }
.gbe:last-child { border-bottom: 0; }
.gbe .t { overflow-wrap: anywhere; }

.house { border: 2px solid var(--hc, var(--navy-2)); }
.house > .bh { background: var(--hc, var(--navy-2)); color: #fff; border-color: var(--hc, var(--navy-2)); }
.prof { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 12px; }
@media (max-width: 460px) { .prof { grid-template-columns: minmax(0, 1fr); } }
.info { border-collapse: collapse; width: 100%; font-size: 11px; }
.info td { padding: 2px 6px 2px 0; vertical-align: top; }
.info td:first-child { color: var(--muted); width: 95px; }
.status { background: #fff8d6; border: 1px solid #e8d48a; padding: 4px 6px; font-style: italic; overflow-wrap: anywhere; }

table.list { border-collapse: collapse; width: 100%; font-size: 11px; }
table.list th { text-align: left; background: #e3edf7; color: var(--navy); padding: 4px; border-bottom: 1px solid var(--line); }
table.list td { padding: 4px; border-bottom: 1px dotted var(--line); vertical-align: top; overflow-wrap: anywhere; }
table.list tr.unread td { font-weight: bold; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

.post { display: grid; grid-template-columns: 110px minmax(0, 1fr); border: 1px solid var(--line); }
.post .pa { background: var(--panel-alt); border-right: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; font-size: 11px; }
.post .pt { padding: 6px 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
@media (max-width: 460px) { .post { grid-template-columns: minmax(0, 1fr); } .post .pa { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; } }

.flash { background: #fff3c4; border: 1px solid #e6c34a; padding: 6px 8px; font-weight: bold; color: #6b4d00; }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.swatches button { width: 24px; height: 24px; border: 2px solid #fff; outline: 1px solid #888; cursor: pointer; }
.swatches button.on { outline: 2px solid var(--ink); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card { border: 1px solid var(--line); background: var(--panel-alt); padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.foot { text-align: center; font-size: 10px; color: var(--muted); padding-top: 10px; }
.points { color: var(--orange-dark); font-weight: bold; }
.blink { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>

<div class="shell">
  <div class="top">
    <div class="logo"><h1>nett<span>by</span></h1><small>nostalgi · uoffisiell fan-replika</small></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="cols">
    <aside id="left"></aside>
    <main id="main"></main>
    <aside id="right"></aside>
  </div>
  <div class="foot">Nettby Nostalgi er laget for moro skyld og har ingen tilknytning til det originale Nettby. Alle beboere her er oppdiktede. Data lagres bare i din egen nettleser.</div>
</div>

<script>
(function () {
  "use strict";
  var KEY = "nettby-nostalgi-v1";
  var mem = null;

  // ---------- lagring ----------
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return mem;
  }
  function save() {
    mem = db;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  }

  // ---------- hjelpere ----------
  var MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function when(ts) {
    var d = new Date(ts), now = new Date();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return "i dag " + hm;
    var y = new Date(now.getTime() - DAY);
    if (d.toDateString() === y.toDateString()) return "i går " + hm;
    return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear() + " " + hm;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function initials(n) { var c = n.replace(/[^A-Za-zÆØÅæøå0-9]/g, ""); return (c.slice(0, 2) || "?").toUpperCase(); }
  function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }

  var COLORS = ["#2f5d95", "#c0392b", "#8e44ad", "#16a085", "#d35400", "#e84393", "#2c3e50", "#27ae60", "#b7950b", "#6c5ce7", "#00838f", "#5d4037"];
  var BYDELER = [
    { id: "sentrum", navn: "Sentrum", om: "Der det skjer. Kino, kjøpesenter og alltid noen på MSN." },
    { id: "havna", navn: "Havna", om: "Brygger, måker og folk som liker rolige kvelder." },
    { id: "skogkanten", navn: "Skogkanten", om: "Emo, metal og lange innlegg om livet." },
    { id: "solbakken", navn: "Solbakken", om: "Glitter, rosa gjestebøker og hjerter overalt." },
    { id: "fjellsiden", navn: "Fjellsiden", om: "Ski, snowboard og folk som aldri er pålogget i helgene." },
    { id: "elvebyen", navn: "Elvebyen", om: "Fotball, gaming og LAN-party hver fredag." }
  ];
  var FORA = [
    { id: "musikk", navn: "Musikk", om: "Hva hører du på nå? Konserter, band og spillelister." },
    { id: "kjaerlighet", navn: "Kjærlighet", om: "Forelsket? Kjærlighetssorg? Del og få råd." },
    { id: "skole", navn: "Skole", om: "Lekser, lærere og hvor lenge det er til sommerferien." },
    { id: "data", navn: "Data og spill", om: "WoW, Counter-Strike, MSN-triks og hjelp med PC-en." },
    { id: "offtopic", navn: "Off topic", om: "Alt annet. Hold det hyggelig." }
  ];

  // ---------- startdata ----------
  function seed() {
    var now = Date.now();
    var people = [
      ["xX_Sara_Xx", "pass", 15, "Moss", "solbakken", "#e84393", "<3 bestisene mine <3 svar i gb da!!", "Heihei! Jeg er Sara, 15 år og elsker Westlife, shopping og bestisene mine. Hater folk som ikke svarer i gb :P"],
      ["Kjekkas88", "pass", 17, "Drammen", "sentrum", "#2c3e50", "på byen i kveld?", "Kjører moped, spiller fotball og er på Nettby når jeg kjeder meg. Legg meg til på MSN!"],
      ["Emo_Martin", "pass", 16, "Hamar", "skogkanten", "#5d4037", "ingen forstår meg uansett...", "My Chemical Romance er livet. Svart er ikke en farge, det er en livsstil."],
      ["lillemy_93", "pass", 14, "Bergen", "havna", "#16a085", "regner i Bergen, som vanlig", "Liker å tegne og skrive dikt. Leser Harry Potter for 4. gang."],
      ["Fotballgutten", "pass", 15, "Trondheim", "elvebyen", "#27ae60", "RBK til topps!!!", "Trener 4 dager i uka. Rosenborg-fan for alltid."],
      ["glitter_jenta", "pass", 13, "Tromsø", "solbakken", "#8e44ad", "*~*~ GLiTTeR ~*~*", "hEi aLLe sAmmEn!! jEg ElsKeR rOsA, hEsTeR oG gLiTTeR!!! kLeM tiL aLLe <33"],
      ["skatern_ole", "pass", 16, "Stavanger", "fjellsiden", "#d35400", "kickflip landa endelig", "Skater, snowboarder, hører på Blink-182. Vinteren er best."],
      ["MSN_Maria", "pass", 17, "Oslo", "sentrum", "#00838f", "pålogget på MSN hele kvelden", "Legg meg til! Bruker alt for mye tid på å lage MSN-navn med hjerter."],
      ["LAN_Lars", "pass", 16, "Kristiansand", "elvebyen", "#6c5ce7", "LAN på fredag, hvem blir med?", "Counter-Strike 1.6, World of Warcraft og mye Solo. Har egen server."],
      ["Ida_xoxo", "pass", 15, "Ålesund", "havna", "#c0392b", "forelsket? kanskje ;)", "Danser jazz og hip-hop. Elsker Beyoncé og O.C."]
    ];
    var users = {};
    people.forEach(function (p, i) {
      users[p[0]] = { name: p[0], pass: p[1], age: p[2], city: p[3], bydel: p[4], color: p[5], status: p[6], about: p[7],
        points: 200 + Math.floor(Math.random() * 3000), joined: now - (400 + i * 60) * DAY, friends: [], requests: [], npc: true, visits: 50 + Math.floor(Math.random() * 900) };
    });
    function fr(a, b) { users[a].friends.push(b); users[b].friends.push(a); }
    fr("xX_Sara_Xx", "glitter_jenta"); fr("xX_Sara_Xx", "Ida_xoxo"); fr("xX_Sara_Xx", "Kjekkas88");
    fr("Kjekkas88", "Fotballgutten"); fr("Kjekkas88", "MSN_Maria"); fr("Emo_Martin", "lillemy_93");
    fr("LAN_Lars", "Fotballgutten"); fr("skatern_ole", "Emo_Martin"); fr("MSN_Maria", "Ida_xoxo"); fr("LAN_Lars", "skatern_ole");

    var gb = [
      ["xX_Sara_Xx", "glitter_jenta", "heiii bestis!! takk for sist <33 du er best i hele verden!! svar da :D", 25 * MIN],
      ["xX_Sara_Xx", "Kjekkas88", "hei sara ;) ses i friminuttet", 3 * HOUR],
      ["Kjekkas88", "MSN_Maria", "Hei! Var gøy på kino i går, legg meg til på MSN da :)", 50 * MIN],
      ["Emo_Martin", "lillemy_93", "Leste diktet ditt. Det var veldig fint, egentlig. :)", 5 * HOUR],
      ["lillemy_93", "Emo_Martin", "takk for at du leste diktet mitt. det betyr mye.", 4 * HOUR],
      ["Fotballgutten", "LAN_Lars", "kommer du på LAN fredag? tar med pc-en min", 2 * HOUR],
      ["glitter_jenta", "xX_Sara_Xx", "*~ KLEM TIL DEG ~* svar i min gb da!!! <333", 15 * MIN],
      ["Ida_xoxo", "MSN_Maria", "Du må fortelle meg hvem det er!!! :O ring meg", 1.5 * HOUR],
      ["skatern_ole", "LAN_Lars", "rå video av kickflippen din, mann", 1 * DAY],
      ["MSN_Maria", "Ida_xoxo", "Heihei! Pålogget nå, kom på MSN :D", 40 * MIN]
    ].map(function (g) { return { id: uid(), to: g[0], from: g[1], text: g[2], ts: now - g[3] }; });

    var threads = [
      { cat: "musikk", title: "Beste band akkurat nå?", posts: [["Emo_Martin", "My Chemical Romance. Ingen diskusjon.", 6 * HOUR], ["xX_Sara_Xx", "Westlife!!! <3", 5 * HOUR], ["skatern_ole", "Blink-182 > alt", 4 * HOUR], ["Ida_xoxo", "Beyoncé, selvsagt.", 2 * HOUR]] },
      { cat: "kjaerlighet", title: "Hvordan vet man om noen liker deg?", posts: [["Ida_xoxo", "Han skriver i gb-en min hver dag men sier ingenting på skolen... hva betyr det?", 1 * DAY], ["MSN_Maria", "Han liker deg 100%!! Spør han på MSN", 20 * HOUR], ["Kjekkas88", "Gutter er sjenerte, bare si hei", 18 * HOUR]] },
      { cat: "skole", title: "Hjelp med matteleksa (brøk)", posts: [["glitter_jenta", "hvordan regner man ut 3/4 + 2/3?? skjønner ingenting", 3 * HOUR], ["lillemy_93", "Felles nevner 12: 9/12 + 8/12 = 17/12. Altså 1 og 5/12.", 2.5 * HOUR], ["glitter_jenta", "TAKK!!! du er best <3", 2 * HOUR]] },
      { cat: "data", title: "LAN-party fredag – hvem blir med?", posts: [["LAN_Lars", "Har plass til 8 stk i kjelleren. Ta med egen PC og skjerm. CS 1.6 og WC3.", 2 * DAY], ["Fotballgutten", "Jeg er med!", 2 * DAY - HOUR], ["skatern_ole", "Hvis mamma kjører meg så kommer jeg", 1 * DAY]] },
      { cat: "offtopic", title: "Hva er MSN-navnet deres?", posts: [["MSN_Maria", "Mitt er ~*~ Maria <3 livet er en fest ~*~ :D", 8 * HOUR], ["xX_Sara_Xx", "xX sArA Xx (L) bestisene mine (L)", 7 * HOUR], ["Emo_Martin", "...", 6 * HOUR]] }
    ].map(function (t) {
      var posts = t.posts.map(function (p) { return { author: p[0], text: p[1], ts: now - p[2] }; });
      return { id: uid(), cat: t.cat, title: t.title, author: posts[0].author, ts: posts[0].ts, posts: posts };
    });

    return { users: users, gb: gb, threads: threads, msgs: [], me: null, version: 1 };
  }

  var db = load() || seed();
  save();

  // ---------- tilstand ----------
  var view = { name: "forside" };
  var flash = "";
  var online = pickOnline();

  function pickOnline() {
    var names = Object.keys(db.users).filter(function (n) { return db.users[n].npc; });
    return names.filter(function () { return Math.random() < 0.6; });
  }
  function me() { return db.me ? db.users[db.me] : null; }
  function user(n) { return db.users[n]; }
  function isOnline(n) { return n === db.me || online.indexOf(n) !== -1; }
  function unreadCount() { var m = me(); if (!m) return 0; return db.msgs.filter(function (x) { return x.to === m.name && !x.read; }).length; }
  function addPoints(n) { var m = me(); if (m) { m.points += n; } }

  function av(name, cls) {
    var u = user(name), c = u ? u.color : "#888";
    return '<span class="av ' + (cls || "") + '" style="background:' + esc(c) + '" aria-hidden="true">' + esc(initials(name)) + "</span>";
  }
  function ulink(name) { return '<button class="lnk" data-go="house" data-arg="' + esc(name) + '"><b>' + esc(name) + "</b></button>"; }

  // ---------- navigasjon ----------
  function go(name, arg) { view = { name: name, arg: arg }; render(); window.scrollTo(0, 0); }

  function renderTabs() {
    var m = me();
    var tabs = [["forside", "Forside"], ["house", "Mitt hus"], ["gjestebok", "Gjestebok"], ["venner", "Venner"], ["forum", "Forum"], ["meldinger", "Meldinger"], ["bydeler", "Bydeler"], ["sok", "Søk"]];
    var reqs = m ? m.requests.length : 0, unread = unreadCount();
    document.getElementById("tabs").innerHTML = tabs.map(function (t) {
      var on = view.name === t[0] && (t[0] !== "house" || view.arg === db.me) ? " on" : "";
      var extra = "";
      if (t[0] === "meldinger" && unread) extra = '<span class="cnt">' + unread + "</span>";
      if (t[0] === "venner" && reqs) extra = '<span class="cnt">' + reqs + "</span>";
      var arg = t[0] === "house" ? ' data-arg="' + esc(db.me || "") + '"' : "";
      return '<button class="' + on + '" data-go="' + t[0] + '"' + arg + ">" + t[1] + extra + "</button>";
    }).join("");
    document.getElementById("who").innerHTML = m
      ? 'Logget inn som <b>' + esc(m.name) + '</b> · <span class="points">' + m.points + ' poeng</span><br><button class="lnk" data-act="logout">Logg ut</button>'
      : 'Du er ikke logget inn<br><button class="lnk" data-go="registrer">Flytt inn i Nettby</button>';
  }

  function renderLeft() {
    var m = me(), h = "";
    if (!m) {
      h += '<div class="box"><div class="bh">Logg inn</div><div class="bb"><form class="form" data-form="login">' +
        '<label>Brukernavn<input type="text" id="li-user" name="user" autocomplete="username"></label>' +
        '<label>Passord<input type="password" id="li-pass" name="pass" autocomplete="current-password"></label>' +
        '<div class="err" id="li-err"></div><div class="row"><button class="btn" type="submit">Logg inn</button></div></form>' +
        '<div class="small">Ny her? <button class="lnk" data-go="registrer">Flytt inn nå!</button></div>' +
        '<div class="small">Eller <button class="lnk" data-act="demo">prøv som demobruker</button></div></div></div>';
    } else {
      h += '<div class="box alt"><div class="bh">Meg</div><div class="bb"><div class="uline">' + av(m.name) + "<div>" + ulink(m.name) +
        '<div class="muted">' + esc(m.age) + " år, " + esc(m.city) + "</div></div></div>" +
        '<div class="small">Poeng: <span class="points">' + m.points + "</span></div>" +
        '<div class="small"><button class="lnk" data-go="house" data-arg="' + esc(m.name) + '">Mitt hus</button> · <button class="lnk" data-go="rediger">Rediger huset</button></div></div></div>';
    }
    h += '<div class="box" id="online">' + onlineHtml() + "</div>";
    document.getElementById("left").innerHTML = h;
  }
  function onlineHtml() {
    var on = Object.keys(db.users).filter(isOnline);
    return '<div class="bh"><span>Pålogget nå</span><span>' + on.length + '</span></div><div class="bb ulist">' +
      on.map(function (n) { return '<div class="uline"><span class="dot"></span>' + ulink(n) + "</div>"; }).join("") + "</div>";
  }

  function renderRight() {

  function last(t) { return t.posts[t.posts.length - 1]; }
  function threadRow(t) {

  }
  function forum(id) { return FORA.filter(function (f) { return f.id === id; })[0] || FORA[0]; }
  function bydel(id) { return BYDELER.filter(function (b) { return b.id === id; })[0] || BYDELER[0]; }

  function needLogin(what) {

  }
  function flashHtml() { if (!flash) return ""; var f = flash; flash = ""; return '<div class="flash">' + esc(f) + "</div>"; }

  V.house = function (name) {

    var m = me(), own = m && m.name === name;

    var isFriend = m && m.friends.indexOf(name) !== -1;
    var pending = m && u.requests.indexOf(m.name) !== -1;
    var h = flashHtml();
    h += '<div class="box house" style="--hc:' + esc(u.color) + '"><div class="bh"><span>' + esc(u.name) + 's hus</span><span>' + (isOnline(name) ? '<span class="blink">●</span> pålogget' : "ikke pålogget") + '</span></div><div class="bb">' +
      '<div class="prof">' + av(name, "big") + '<div style="display:flex;flex-direction:column;gap:6px;min-width:0">' +

      "</div></div></div>" +
      '<div><b>Om meg</b><div style="overflow-wrap:anywhere">' + (u.about ? nl2br(u.about) : '<span class="muted">Ingenting her ennå.</span>') + "</div></div></div></div>";

    h += '<div class="box"><div class="bh"><span>Venner</span><span>' + u.friends.length + '</span></div><div class="bb"><div class="row">' +

      return '<div class="gbe">' + av(g.from) + '<div class="t">' + ulink(g.from) + ' <span class="muted">' + when(g.ts) + reply +
        (canDel ? ' · <button class="lnk" data-act="delgb" data-arg="' + g.id + '">slett</button>' : "") + "</span><br>" + nl2br(g.text) + "</div></div>";
    }).join("") : '<div class="muted">Gjesteboka er tom. Bli den første til å skrive!</div>';
    h += "</div></div>";

  V.gjestebok = function () { if (!db.me) return needLogin("Gjestebok"); return V.house(db.me); };

  V.rediger = function () {
    var m = me(); if (!m) return needLogin("Rediger huset");
    return '<div class="box"><div class="bh">Rediger huset ditt</div><div class="bb"><form class="form" data-form="edit">' +

      '<label>Om meg<textarea id="ed-about" name="about" maxlength="2000">' + esc(m.about) + "</textarea></label>" +
      '<div><div class="muted" style="margin-bottom:3px">Farge på huset</div><div class="swatches" role="radiogroup" aria-label="Farge på huset">' +
      COLORS.map(function (c) { return '<button type="button" role="radio" aria-checked="' + (c === m.color) + '" aria-label="Farge ' + c + '" class="' + (c === m.color ? "on" : "") + '" style="background:' + c + '" data-act="color" data-arg="' + c + '"></button>'; }).join("") +
      '</div></div><div class="row"><button class="btn" type="submit">Lagre</button><button class="btn grey" type="button" data-go="house" data-arg="' + esc(m.name) + '">Avbryt</button></div></form></div></div>';
  };

    var m = me(); if (!m) return needLogin("Venner");

      h += '<div class="box"><div class="bh">Venneforespørsler</div><div class="bb ulist">' + m.requests.map(function (r) {
        return '<div class="uline">' + av(r) + "<div>" + ulink(r) + ' vil bli venn med deg<div class="row"><button class="btn" data-act="accept" data-arg="' + esc(r) + '">Godta</button><button class="btn grey" data-act="decline" data-arg="' + esc(r) + '">Avslå</button></div></div></div>';
      }).join("") + "</div></div>";

      (m.friends.length ? '<div class="grid2">' + m.friends.map(function (f) {
        var u = user(f);
        return '<div class="card"><div class="uline">' + av(f) + "<div>" + ulink(f) + '<div class="muted">' + esc(u.age) + " år, " + esc(u.city) + "</div></div></div>" +

  V.forum = function () {

    h += FORA.map(function (f) {

    }).join("");
    return h + "</table></div></div>";
  };

  V.kategori = function (id) {
    var f = forum(id);
    var ts = db.threads.filter(function (t) { return t.cat === id; }).sort(function (a, b) { return last(b).ts - last(a).ts; });
    var h = flashHtml() + '<div class="small"><button class="lnk" data-go="forum">Forum</button> » ' + esc(f.navn) + "</div>";

      (ts.length ? '<table class="list"><tr><th>Tråd</th><th>Svar</th><th>Siste</th></tr>' + ts.map(threadRow).join("") + "</table>" : '<div class="muted">Ingen tråder her ennå.</div>') + "</div></div>";

    return h;
  };

    var h = '<div class="small"><button class="lnk" data-go="forum">Forum</button> » <button class="lnk" data-go="kategori" data-arg="' + f.id + '">' + esc(f.navn) + "</button> » " + esc(t.title) + "</div>";

    var sent = db.msgs.filter(function (x) { return x.from === m.name; }).sort(function (a, b) { return b.ts - a.ts; });

    return '<div class="box"><div class="bh">Bydeler i Nettby</div><div class="bb"><div class="grid2">' + BYDELER.map(function (b) {

  // ---------- handlinger ----------
  function login(name) { db.me = name; online = online.filter(function (n) { return n !== name; }); save(); }

  function createUser(name, pass, age, city, bd) {
    db.users[name] = { name: name, pass: pass, age: age, city: city, bydel: bd, color: pick(COLORS), status: "ny i Nettby!", about: "",
      points: 10, joined: Date.now(), friends: [], requests: [], visits: 0 };
    // en hyggelig velkomst fra en nabo
    var nb = Object.keys(db.users).filter(function (n) { return db.users[n].npc && db.users[n].bydel === bd; })[0] || "MSN_Maria";
    db.gb.push({ id: uid(), to: name, from: nb, text: "Velkommen til " + bydel(bd).navn + "! :D Legg meg til som venn da", ts: Date.now() });
    db.users[name].requests.push(nb);
  }

  var GB_REPLIES = ["hei!! takk for innlegget :D", "heihei <3 svar tilbake ;)", "haha du er så morsom xD", "takk for sist!! ses i morgen?", "kleeem til deg <33", "hei! kjenner vi hverandre? :P", "lol ja enig!!", "god natt da, snakkes i morgen :)"];
  var MSG_REPLIES = ["Hei! Takk for meldingen :) Hva skjer?", "haha, ja! Legg meg til på MSN, så snakkes vi der", "Hmm, la meg tenke på det... ;)", "Kult! Ses på skolen i morgen?", "Ja, jeg er med!"];
  var FORUM_REPLIES = ["Enig!", "Hmm, ikke helt enig, men ok :P", "Endelig noen som sier det!", "+1", "haha dette er så sant", "Kan noen forklare litt mer?"];

  function typing() { var a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
  function npcLater(fn) {
    setTimeout(function () {
      fn(); save();
      if (typing()) { renderTabs(); return; }
      render();
    }, 2500 + Math.random() * 4000);
  }

  function onSubmit(e) {
    var form = e.target.closest("form[data-form]"); if (!form) return;
    e.preventDefault();
    var t = form.getAttribute("data-form"), arg = form.getAttribute("data-arg"), f = form.elements, m = me();
    function v(n) { return f[n] ? String(f[n].value).trim() : ""; }

    if (t === "login") {
      var u = user(v("user"));
      if (!u || u.pass !== v("pass")) { document.getElementById("li-err").textContent = "Feil brukernavn eller passord. Sjekk skrivemåten og prøv igjen."; return; }
      login(u.name); flash = "Velkommen tilbake, " + u.name + "!"; go("forside");
    } else if (t === "register") {
      var name = v("user"), err = "";
      if (!/^[A-Za-z0-9_æøåÆØÅ-]{3,20}$/.test(name)) err = "Brukernavnet må være 3–20 tegn: bokstaver, tall, _ eller -.";
      else if (db.users[name]) err = "Brukernavnet er opptatt. Velg et annet.";
      else if (!v("pass")) err = "Skriv inn et passord.";
      if (err) { document.getElementById("rg-err").textContent = err; return; }
      createUser(name, v("pass"), parseInt(v("age"), 10) || 15, v("city") || "Oslo", v("bydel"));
      login(name); flash = "Gratulerer, du har flyttet inn! Du har fått et innlegg i gjesteboka."; go("house", name);
    } else if (t === "gb" && m) {
      var text = v("text"); if (!text) return;
      db.gb.push({ id: uid(), to: arg, from: m.name, text: text, ts: Date.now() }); addPoints(5);
      var target = user(arg);
      if (target && target.npc) npcLater(function () { db.gb.push({ id: uid(), to: m.name, from: arg, text: pick(GB_REPLIES), ts: Date.now() }); flash = arg + " har svart i gjesteboka di!"; });
      save(); flash = "Innlegget ble lagt inn."; go("house", arg);
    } else if (t === "edit" && m) {
      m.status = v("status"); m.age = parseInt(v("age"), 10) || m.age; m.city = v("city"); m.bydel = v("bydel"); m.about = f.about.value;
      save(); flash = "Huset ditt er oppdatert."; go("house", m.name);
    } else if (t === "thread" && m) {
      var th = { id: uid(), cat: arg, title: v("title"), author: m.name, ts: Date.now(), posts: [{ author: m.name, text: v("text"), ts: Date.now() }] };
      db.threads.push(th); addPoints(10);
      npcLater(function () { var n = pick(online.length ? online : ["MSN_Maria"]); th.posts.push({ author: n, text: pick(FORUM_REPLIES), ts: Date.now() }); });
      save(); go("trad", th.id);
    } else if (t === "reply" && m) {
      var tr = db.threads.filter(function (x) { return x.id === arg; })[0]; if (!tr) return;
      tr.posts.push({ author: m.name, text: v("text"), ts: Date.now() }); addPoints(5); save(); go("trad", arg);
    } else if (t === "msg" && m) {
      var to = v("to"), subj = v("subject");
      db.msgs.push({ id: uid(), to: to, from: m.name, subject: subj, text: v("text"), ts: Date.now(), read: false });
      if (user(to) && user(to).npc) npcLater(function () { db.msgs.push({ id: uid(), to: m.name, from: to, subject: "SV: " + subj.replace(/^SV: /, ""), text: pick(MSG_REPLIES), ts: Date.now(), read: false }); flash = "Ny melding fra " + to + "!"; });
      save(); flash = "Meldingen ble sendt til " + to + "."; go("meldinger");
    } else if (t === "search") {
      go("sok", v("q"));
    }
  }

  function onClick(e) {
    var el = e.target.closest("[data-go],[data-act]"); if (!el) return;
    var arg = el.getAttribute("data-arg"), m = me();
    if (el.hasAttribute("data-go")) {
      var name = el.getAttribute("data-go");
      if (name === "house" && !arg) arg = db.me;
      view = { name: name, arg: arg, subj: el.getAttribute("data-subj") };
      render(); window.scrollTo(0, 0); return;
    }
    var act = el.getAttribute("data-act");
    if (act === "logout") { db.me = null; save(); online = pickOnline(); go("forside"); }
    else if (act === "demo") {
      if (!db.users["Nostalgiker"]) createUser("Nostalgiker", "demo", 16, "Lillehammer", "sentrum");
      login("Nostalgiker"); flash = "Du er logget inn som demobruker. Utforsk i vei!"; go("house", "Nostalgiker");
    }
    else if (act === "addfriend" && m) {
      var u = user(arg); if (!u || u.requests.indexOf(m.name) !== -1) return;
      u.requests.push(m.name); addPoints(2); save(); flash = "Venneforespørsel sendt til " + arg + ".";
      if (u.npc) npcLater(function () {
        u.requests = u.requests.filter(function (r) { return r !== m.name; });
        if (u.friends.indexOf(m.name) === -1) { u.friends.push(m.name); m.friends.push(u.name); }
        flash = arg + " har godtatt venneforespørselen din!";
      });
      render();
    }
    else if ((act === "accept" || act === "decline") && m) {
      m.requests = m.requests.filter(function (r) { return r !== arg; });
      if (act === "accept" && m.friends.indexOf(arg) === -1) { m.friends.push(arg); user(arg).friends.push(m.name); addPoints(2); flash = "Du og " + arg + " er nå venner!"; }
      save(); render();
    }
    else if (act === "delgb" && m) { db.gb = db.gb.filter(function (g) { return g.id !== arg; }); save(); render(); }
    else if (act === "color" && m) {
      m.color = arg; save();
      el.parentNode.querySelectorAll("button").forEach(function (b) { var on = b === el; b.classList.toggle("on", on); b.setAttribute("aria-checked", String(on)); });
    }
  }

  document.addEventListener("submit", onSubmit);
  document.addEventListener("click", onClick);

  // folk logger inn og ut av seg selv
  setInterval(function () {
    var npcs = Object.keys(db.users).filter(function (n) { return db.users[n].npc; });
    var n = pick(npcs), i = online.indexOf(n);
    if (i === -1) online.push(n); else if (online.length > 3) online.splice(i, 1);
    var box = document.getElementById("online"); if (box) box.innerHTML = onlineHtml();
  }, 15000);

  render();
})();
</script>
